app = "bts-shift-schedule-api"
primary_region = "nrt"

[build]

[env]
  PORT = "4000"
  DB_PATH = "/data/app.db"

[[mounts]]
  source = "app_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
